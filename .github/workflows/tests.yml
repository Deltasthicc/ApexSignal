name: tests

on:
  pull_request:
    branches: [main, integration/main]
  push:
    branches: [main, integration/main]
  workflow_dispatch: {}

jobs:
  data_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately not requirements.txt: the window tests run on synthetic
      # frames, so CI never installs FastF1 or downloads a session.
      - run: pip install -r data_pipeline/requirements-test.txt
      - run: pytest data_pipeline/tests

  radio_ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/radio_ai/requirements.txt
      # python -m pytest, not bare pytest: -m adds the cwd to sys.path so
      # `from app...` resolves. A bare `pytest` invocation doesn't add it,
      # which is exactly why this job failed on every prior CI run while
      # scripts/run_test_suites.py (which does use -m) passed locally.
      - run: python -m pytest tests
        working-directory: services/radio_ai

  core_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/core_api/requirements.txt
      - run: python -m pytest tests
        working-directory: services/core_api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
